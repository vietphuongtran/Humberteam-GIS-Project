<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ontario Colleges and Universities (2018–2021)</title>
  <link href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" />
  <style>
    :root {
      --primary: #0f172a;
      --primary-light: #1e293b;
      --dark: #1e293b;
      --light: #f8fafc;
      --gray: #64748b;
      --white: #ffffff;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--light);
      margin: 0;
      color: var(--dark);
    }

    nav {
      background: var(--white);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-left button {
      background: var(--primary);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
    }

    .nav-right button {
      background: transparent;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
      color: var(--dark);
    }

    .hero {
      background: linear-gradient(to right, #0f172a, #1e293b);
      color: white;
      padding: 3rem 1rem;
      text-align: center;
    }

    .hero h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .hero p {
      font-size: 1rem;
      opacity: 0.9;
    }

    .filters {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 1rem;
      background: white;
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    label {
      font-size: 0.875rem;
      color: var(--gray);
    }

    select, input[type="text"] {
      padding: 0.5rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.875rem;
      min-width: 180px;
    }

    #ontario-table {
      max-width: 1200px;
      margin: 0 auto 2rem auto;
    }

    .buttons {
      max-width: 1200px;
      margin: 1rem auto 3rem auto;
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
    }

    .export-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Dark Mode */
    .dark-mode {
      background: #0f172a;
      color: white;
    }

    .dark-mode nav {
      background: #1e293b;
    }

    .dark-mode .filters {
      background: #1e293b;
    }

    .dark-mode input,
    .dark-mode select {
      background: #334155;
      border: 1px solid #475569;
      color: white;
    }

    .dark-mode .export-btn {
      background: #475569;
    }

    .dark-mode .nav-right button {
      color: white;
    }

    @media (max-width: 768px) {
      .filters {
        flex-direction: column;
        align-items: stretch;
      }
      .buttons {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-left">
      <button onclick="history.back()">Back</button>
    </div>
    <div class="nav-right">
      <button onclick="toggleDarkMode()">🌙</button>
    </div>
  </nav>

  <div class="hero">
    <h1>Ontario Colleges and Universities (2018–2021)</h1>
    <p>Explore enrollment trends by institution, gender, and program type across Ontario's post-secondary system.</p>
  </div>

  <div class="filters">
    <div>
      <label>Search:</label><br>
      <input type="text" id="searchInput" placeholder="Type to search..." />
    </div>

    <div>
      <label for="yearFilter">Year:</label><br>
      <select id="yearFilter"><option value="">All</option></select>
    </div>

    <div>
      <label for="institutionFilter">Institution:</label><br>
      <select id="institutionFilter"><option value="">All</option></select>
    </div>

    <div>
      <label for="genderFilter">Gender:</label><br>
      <select id="genderFilter"><option value="">All</option></select>
    </div>

    <div>
      <label for="programFilter">Program Type:</label><br>
      <select id="programFilter"><option value="">All</option></select>
    </div>
  </div>

  <div id="ontario-table"></div>

  <div class="buttons">
    <button class="export-btn" onclick="exportOntarioTable()">Export CSV</button>
  </div>

  <script>
    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
    }

    function exportOntarioTable() {
      if (window.table) {
        window.table.download("csv", "ontario_filtered_data.csv");
      }
    }
  </script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
<script src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>

<script>
  let table;
  let currentFilteredData = [];

  document.addEventListener("DOMContentLoaded", () => {
    Papa.parse("data/data-1752857100457.csv", {
      download: true,
      header: true,
      complete: function (results) {
        const rawData = results.data;
        const data = rawData.filter(row =>
          row["ref_date"] &&
          row["education_data_name"] &&
          row["Field of study"] &&
          row["Program type"] &&
          row["gender"] &&
          row["value"] &&
          !isNaN(row["value"])
        );

        window.originalOntarioData = data;
        currentFilteredData = data;

        table = new Tabulator("#ontario-table", {
          data,
          layout: "fitColumns",
          pagination: "local",
          paginationSize: 10,
          columns: [
            { title: "Year", field: "ref_date" },
            { title: "Institution", field: "education_data_name" },
            { title: "Field of Study", field: "Field of study" },
            { title: "Program Type", field: "Program type" },
            { title: "Gender", field: "gender" },
            { title: "Students", field: "value", sorter: "number", hozAlign: "right" }
          ]
        });

        populateDropdown("yearFilter", [...new Set(data.map(d => d["ref_date"]))]);
        populateDropdown("institutionFilter", [...new Set(data.map(d => d["education_data_name"]))]);
        populateDropdown("genderFilter", [...new Set(data.map(d => d["gender"]))]);
        populateDropdown("programFilter", [...new Set(data.map(d => d["Program type"]))]);

        document.getElementById("searchInput").addEventListener("input", filterOntarioTable);
        ["yearFilter", "institutionFilter", "genderFilter", "programFilter"].forEach(id => {
          document.getElementById(id)?.addEventListener("change", filterOntarioTable);
        });
      }
    });
  });

  function populateDropdown(id, items) {
    const dropdown = document.getElementById(id);
    dropdown.innerHTML = `<option value="">All</option>`;
    items.sort().forEach(val => {
      const opt = document.createElement("option");
      opt.value = val;
      opt.textContent = val;
      dropdown.appendChild(opt);
    });
  }

  function filterOntarioTable() {
    const data = window.originalOntarioData || [];
    const gender = document.getElementById("genderFilter")?.value;
    const year = document.getElementById("yearFilter")?.value;
    const institution = document.getElementById("institutionFilter")?.value;
    const program = document.getElementById("programFilter")?.value;
    const search = document.getElementById("searchInput")?.value.toLowerCase().trim() || "";

    const filtered = data.filter(row => {
      return (
        (!gender || row["gender"] === gender) &&
        (!year || row["ref_date"] === year) &&
        (!institution || row["education_data_name"] === institution) &&
        (!program || row["Program type"] === program) &&
        Object.values(row).some(val => String(val).toLowerCase().includes(search))
      );
    });

    currentFilteredData = filtered;
    table.setData(filtered);
  }

  function toggleDarkMode() {
    document.body.classList.toggle("dark-mode");
    const tabulatorEl = document.querySelector(".tabulator");
    if (tabulatorEl) {
      tabulatorEl.classList.toggle("tabulator-dark");
    }
  }

  function exportOntarioTable() {
    if (currentFilteredData.length > 0) {
      const headers = Object.keys(currentFilteredData[0]);
      const csv = [headers.join(",")].concat(
        currentFilteredData.map(row =>
          headers.map(h => `"${(row[h] || "").toString().replace(/"/g, '""')}"`).join(",")
        )
      ).join("\n");

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "ontario_filtered_data.csv";
      a.click();
      URL.revokeObjectURL(url);
    } else {
      alert("No data available to export.");
    }
  }
</script>

</body>
</html>
