<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Toronto Colleges and Universities (2018–2023)</title>
  <link href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" />
  <style>
    :root {
      --primary: #0f172a;
      --primary-light: #1e293b;
      --dark: #1e293b;
      --light: #f8fafc;
      --gray: #64748b;
      --white: #ffffff;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--light);
      margin: 0;
      color: var(--dark);
    }

    nav {
      background: var(--white);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-left button {
      background: var(--primary);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
    }

    .nav-right button {
      background: transparent;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
      color: var(--dark);
    }

    .hero {
      background: linear-gradient(to right, #0f172a, #1e293b);
      color: white;
      padding: 3rem 1rem;
      text-align: center;
    }

    .hero h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .hero p {
      font-size: 1rem;
      opacity: 0.9;
    }

    .filters {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 1rem;
      background: white;
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    label {
      font-size: 0.875rem;
      color: var(--gray);
    }

    select, input[type="text"] {
      padding: 0.5rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.875rem;
      min-width: 180px;
    }

    #tabulator-table {
      max-width: 1200px;
      margin: 0 auto 2rem auto;
    }

    .buttons {
      max-width: 1200px;
      margin: 1rem auto 3rem auto;
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
    }

    .export-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Dark Mode */
    .dark-mode {
      background: #0f172a;
      color: white;
    }

    .dark-mode nav {
      background: #1e293b;
    }

    .dark-mode .filters {
      background: #1e293b;
    }

    .dark-mode input,
    .dark-mode select {
      background: #334155;
      border: 1px solid #475569;
      color: white;
    }

    .dark-mode .export-btn {
      background: #475569;
    }

    .dark-mode .nav-right button {
      color: white;
    }

    @media (max-width: 768px) {
      .filters {
        flex-direction: column;
        align-items: stretch;
      }
      .buttons {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-left">
      <button onclick="history.back()">← Back</button>
    </div>
    <div class="nav-right">
      <button onclick="toggleDarkMode()">🌙</button>
    </div>
  </nav>

  <div class="hero">
    <h1>Toronto Colleges and Universities (2018–2023)</h1>
    <p>Explore enrollment trends by institution, gender, and program type across Toronto's post-secondary system.</p>
  </div>

  <div class="filters">
    <div>
      <label>Search:</label><br>
      <input type="text" id="searchInput" placeholder="Type to search..." />
    </div>
    <div>
      <label for="yearFilter">Year:</label><br>
      <select id="yearFilter"><option value="">All</option></select>
    </div>
    <div>
      <label for="institutionFilter">Institution:</label><br>
      <select id="institutionFilter"><option value="">All</option></select>
    </div>
    <div>
      <label for="genderFilter">Gender:</label><br>
      <select id="genderFilter"><option value="">All</option></select>
    </div>
  </div>

  <div id="tabulator-table"></div>

  <div class="buttons">
    <button class="export-btn" onclick="exportTable()">Export CSV</button>
  </div>

  <script>
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }

    function exportTable() {
      if (window.table) {
        window.table.download("csv", "toronto-students.csv");
      } else {
        alert("Table is not initialized yet.");
      }
    }
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
